server:
  port: 8090

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI:https://dev-wgk04dj5v68sbhre.us.auth0.com/}
  application:
    name: billpay-worker-service

  datasource:
    url: jdbc:postgresql://localhost:5432/billpayworkerdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate      # schema is owned by Flyway (src/main/resources/db/migration)
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${BILLPAY_WORKER_CONSUMER_GROUP:billpay-worker-v1}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all

# A batch is closed and sent to settlement when it reaches max-size payments
# or has been open for max-age, whichever comes first.
batching:
  max-size: 50
  max-age: 15s

auth0:
  audience: ${AUTH0_AUDIENCE:https://mockbank/api}
