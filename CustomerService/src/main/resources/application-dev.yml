spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI:https://dev-wgk04dj5v68sbhre.us.auth0.com/}
  
  datasource:
    url: jdbc:postgresql://localhost:5432/customerdb
    username: postgres
    password: postgres

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: validate      # schema is owned by Flyway (src/main/resources/db/migration)
      
application:
  name: customer-service

server:
  port: 8083

  
auth:
  service:
    url: http://localhost:8094/

auth0:
  audience: ${AUTH0_AUDIENCE:https://mockbank/api}

