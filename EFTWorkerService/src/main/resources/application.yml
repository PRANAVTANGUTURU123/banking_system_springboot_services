server:
  port: 8091

spring:
  application:
    name: eft-worker-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: eft-worker-service
      auto-offset-reset: earliest
    producer:
      acks: all
    listener:
      ack-mode: record

  datasource:
    url: jdbc:postgresql://localhost:5432/eftworkerdb
    username: eftworker
    password: eftworker

  jpa:
    hibernate:
      ddl-auto: validate      # schema is owned by Flyway (src/main/resources/db/migration)
    open-in-view: false

# A batch is closed and sent to settlement when it reaches max-size payments
# or has been open for max-age, whichever comes first.
batching:
  max-size: 50
  max-age: 15s

management:
  endpoints:
    web:
      exposure:
        include: health,info
