server:
  port: 8091

spring:
  application:
    name: eft-worker-service

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: eft-worker-service
      auto-offset-reset: earliest
    listener:
      ack-mode: record

  datasource:
    url: jdbc:postgresql://localhost:5432/eftworkerdb
    username: eftworker
    password: eftworker

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

