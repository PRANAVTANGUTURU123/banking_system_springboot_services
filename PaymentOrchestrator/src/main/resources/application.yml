server:
  port: 8086
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI:https://dev-wgk04dj5v68sbhre.us.auth0.com/}

      client:
        registration:
          account-m2m:
            provider: auth0
            authorization-grant-type: client_credentials
            # Only used outside the dev profile; set via environment (see .env.example)
            client-id: ${AUTH0_M2M_CLIENT_ID:set-AUTH0_M2M_CLIENT_ID}
            client-secret: ${AUTH0_M2M_CLIENT_SECRET:set-AUTH0_M2M_CLIENT_SECRET}
            scope: admin:accounts

        provider:
          auth0:
            token-uri: ${AUTH0_ISSUER_URI:https://dev-wgk04dj5v68sbhre.us.auth0.com/}oauth/token

  application:
    name: payment-orchestrator

  datasource:
    url: jdbc:postgresql://localhost:5432/paymentdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate      # schema is owned by Flyway (src/main/resources/db/migration)
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: ${PAYMENT_ORCH_CONSUMER_GROUP:payment-orch-consumers-v1}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

    listener:
      type: single

account:
  service:
    url: http://localhost:8084

biller:
  service:
    url: http://localhost:8088

eft:
  service:
    url: http://localhost:8089

auth0:
  audience: ${AUTH0_AUDIENCE:https://mockbank/api}
