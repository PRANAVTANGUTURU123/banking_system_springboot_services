server:
  port: 8089

spring:
  application:
    name: eft-service

  datasource:
    url: jdbc:postgresql://localhost:5432/eftdb
    username: eft
    password: eft
  jpa:
    hibernate:
      ddl-auto: validate      # schema is owned by Flyway (src/main/resources/db/migration)
    properties:
      hibernate:
        format_sql: true

