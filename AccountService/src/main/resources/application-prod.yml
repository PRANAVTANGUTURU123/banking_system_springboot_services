server:
  port: 8084

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI}
  application:
    name: account-service

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate      # schema is owned by Flyway (src/main/resources/db/migration)
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

 
          
logging:
  level:
     org.springframework.security.oauth2.jwt: TRACE
     org.springframework.security.oauth2.server.resource.authentication: TRACE
     org.springframework.security: INFO
customer:
  service:
    url: http://customer-service:8083


auth0:
  audience: ${AUTH0_AUDIENCE}
