server:
  port: 8084

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI:https://dev-wgk04dj5v68sbhre.us.auth0.com/}
  application:
    name: account-service

  datasource:
    url: jdbc:postgresql://localhost:5432/accountsdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate      # schema is owned by Flyway (src/main/resources/db/migration)
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect


 
logging:
  level:
    org.springframework.security: DEBUG
    
account:
  service:
    url: http://localhost:8084
    

auth0:
  audience: ${AUTH0_AUDIENCE:https://mockbank/api}



